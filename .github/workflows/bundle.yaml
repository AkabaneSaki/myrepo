name: Bundle TavernHelper scripts

on:
  push:
    paths:
      - 'src/**'
      - 'util/**'
      - 'config/workshop.json'
      - 'scripts/build-workshop-legacy-shim.mjs'
      - 'scripts/check-workshop-bundles.mjs'
      - 'scripts/check-workshop-compat.mjs'
      - 'scripts/check-workshop-config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - '.github/workflows/bundle.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Workshop source of truth
        run: pnpm check:workshop-config

      - name: Build all client artifact lifecycles
        run: pnpm build:all

      - name: Verify release, compatibility and staging artifacts
        run: pnpm check:workshop-bundles

      - name: Commit hotfix release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/CreativeWorkshop/index.js test-dist/CreativeWorkshop/index.js
          if ! git diff --cached --quiet; then
            git commit -m "build(workshop): bundle 2.1.3"
            git push
          fi
