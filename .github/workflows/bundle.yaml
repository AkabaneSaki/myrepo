name: Bundle TavernHelper scripts

on:
  push:
    paths:
      - 'src/**'
      - 'util/**'
      - 'config/**'
      - 'scripts/check-workshop-config.mjs'
      - 'scripts/check-workshop-bundles.mjs'
      - 'tests/auto-dialogue-beautifier-smoke.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - '.github/workflows/bundle.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check Workshop source of truth
        run: pnpm check:workshop-config

      - name: Build dist
        run: pnpm build

      - name: Verify built Workshop bundles
        run: pnpm check:workshop-bundles

      - name: Verify adaptive regex initialization
        run: node tests/auto-dialogue-beautifier-smoke.mjs --bundle

      - name: Commit refreshed staging bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/CreativeWorkshop-staging/index.js dist/CreativeWorkshop-staging/index.js.map
          if git diff --cached --quiet; then
            echo "Staging bundle already current"
            exit 0
          fi
          git commit -m "build(workshop): refresh staging bundle"
          git push origin HEAD:staging
