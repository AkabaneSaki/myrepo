<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Poem Workshop · EJS Preflight</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--panel:#fff;--panel2:#f8f9fb;--text:#1d2028;--muted:#687080;--line:#d9dde5;--accent:#5965d8;--danger:#b92f41;--dangerbg:#fff0f2;--warn:#9a6700;--warnbg:#fff7df;--ok:#18794e;--okbg:#ebf9f1;--info:#315a9c;--infobg:#eef5ff;--shadow:0 12px 40px rgba(28,35,52,.08);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--panel:#191c23;--panel2:#20242c;--text:#edf0f7;--muted:#9ba3b4;--line:#323846;--accent:#929aff;--danger:#ff8794;--dangerbg:#3a2025;--warn:#f3c45f;--warnbg:#3a321e;--ok:#66d79d;--okbg:#18382a;--info:#8eb8ff;--infobg:#1c2d49;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:32px 0 64px}.hero{margin-bottom:20px}h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px);letter-spacing:-.03em}.sub{margin:0;color:var(--muted);line-height:1.65;max-width:850px}.privacy{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ok);background:var(--okbg);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.drop{display:block;padding:26px;text-align:center;border:2px dashed var(--line);border-radius:16px;margin:18px;transition:.15s ease;cursor:pointer;background:var(--panel2)}.drop.drag{border-color:var(--accent)}.drop strong{display:block;font-size:18px;margin-bottom:7px}.drop small{display:block;color:var(--muted);line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:9px 14px;cursor:pointer;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}#fileInput{display:none}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.metric{padding:16px}.metric b{display:block;font-size:26px;margin-bottom:3px}.metric span{color:var(--muted);font-size:13px}.section{margin-top:18px;padding:18px}.section h2{margin:0 0 14px;font-size:19px}.finding{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:10px 0;background:var(--panel2)}.finding-head{display:flex;align-items:flex-start;gap:10px}.badge{flex:0 0 auto;font-size:12px;font-weight:800;border-radius:999px;padding:3px 8px}.badge.high{color:var(--danger);background:var(--dangerbg)}.badge.warn{color:var(--warn);background:var(--warnbg)}.badge.info{color:var(--info);background:var(--infobg)}.finding-title{font-weight:750;line-height:1.4}.finding p{margin:7px 0 0;color:var(--muted);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.fix{color:var(--text)!important}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.book h3{margin:0 0 8px;font-size:15px;overflow-wrap:anywhere}.book-meta{color:var(--muted);font-size:13px;line-height:1.55}.foot{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.65}.hidden{display:none!important}
@media(max-width:760px){.shell{width:min(100% - 18px,1080px);padding-top:18px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.books{grid-template-columns:1fr}.drop{margin:10px;padding:22px 14px}.section{padding:14px}}
</style>
</head>
<body>
<main class="shell">
<header class="hero">
<h1>EJS Preflight</h1>
<p class="sub">把 SillyTavern 世界书 JSON 拖进来，检查 EJS 作用域/泄露、明显危险代码、外链与 EJS 语法。外链检查覆盖所有条目内容；EJS 只做静态分析，不会执行。</p>
<div class="privacy">● 文件只在当前浏览器本地读取，不上传</div>
</header>
<section class="panel">
<label class="drop" id="dropZone" for="fileInput">
<strong>拖入世界书 JSON，或点这里选择</strong>
<small>可一次选择多个文件；结果会标明规则 ID、条目、行号与修复建议</small>
<div class="actions"><span class="btn primary">选择 JSON</span><button class="btn" type="button" id="clearBtn">清空</button><button class="btn" type="button" id="exportBtn" disabled>导出报告</button></div>
</label>
<input id="fileInput" type="file" accept=".json,application/json" multiple>
</section>
<section id="resultRoot" class="hidden">
<div class="summary">
<div class="panel metric"><b id="mBooks">0</b><span>世界书</span></div>
<div class="panel metric"><b id="mEntries">0</b><span>已扫描条目</span></div>
<div class="panel metric"><b id="mHigh">0</b><span>高风险 / 确定错误</span></div>
<div class="panel metric"><b id="mWarn">0</b><span>需要处理 / 确认</span></div>
</div>
<section class="panel section"><h2>检查结果</h2><div id="findings"></div></section>
<section class="panel section"><h2>已读取世界书</h2><div id="books" class="books"></div></section>
</section>
<p class="foot">规则范围：L1–L6（作用域与共享状态）、M1–M6（危险/难理解代码）、U2–U5（外链）以及 EJS 解析错误。工具刻意只做可解释的静态检查；没有告警不等于运行时绝对安全。</p>
</main>
<script>
(() => {
'use strict';
const MAX_FILE_BYTES=12*1024*1024;
const WORKSHOP_META_RE=/<%#\s*poem-workshop-meta:v1-start[\s\S]*?poem-workshop-meta:v1-end\s*%>/gi;
const GENERIC_GLOBAL_NAMES=new Set(['data','value','result','state','temp','tmp','config','ctx','context','output','response','item']);
const OFFICIAL_URL_RULES=[
  {host:'testingcf.jsdelivr.net',path:/^\/gh\/StageDog\/tavern_resource(?:\/|$)/i},
  {host:'cdn.jsdelivr.net',path:/^\/gh\/StageDog\/tavern_resource(?:\/|$)/i},
  {host:'raw.githubusercontent.com',path:/^\/StageDog\/tavern_resource(?:\/|$)/i},
  {host:'github.com',path:/^\/zonde306\/ST-Prompt-Template(?:\/|$)/i}
];
const q=id=>document.getElementById(id);
const state={books:[],findings:[],report:null};

function preserveLines(text){return String(text||'').replace(WORKSHOP_META_RE,m=>'\n'.repeat((m.match(/\n/g)||[]).length))}
function parseDecorators(content){
  const lines=content.replace(/\r\n/g,'\n').split('\n'),decorators=[];
  for(const line of lines){if(!line.startsWith('@@')||line.startsWith('@@@'))break;decorators.push(line.trim())}
  return{isPrivate:decorators.some(x=>x.split(/\s+/,1)[0]==='@@private')};
}
function extractEntries(json,fileName,bookOrder){
  const raw=[json&&json.entries,json&&json.data&&json.data.entries,json&&json.world_info&&json.world_info.entries].filter(Boolean)[0];
  if(!raw||(typeof raw!=='object'&&!Array.isArray(raw)))throw new Error('找不到世界书 entries');
  const list=Array.isArray(raw)?raw.map((v,i)=>[String(i),v]):Object.entries(raw),out=[];let order=0;
  for(const [key,value] of list){
    if(!value||typeof value!=='object'||typeof value.content!=='string')continue;
    const content=preserveLines(value.content),parsed=parseDecorators(content);
    out.push({id:fileName+':'+key,fileName,bookOrder,entryOrder:order++,key,uid:value.uid??key,name:value.comment||value.name||('Entry '+key),content,isPrivate:parsed.isPrivate,hasEjs:content.includes('<%'),symbols:[]});
  }
  return out;
}
function lineFromIndex(text,index){return(text.slice(0,Math.max(0,index)).match(/\n/g)||[]).length+1}
function blankRange(chars,start,end){for(let i=start;i<end;i++)if(chars[i]!=='\n')chars[i]=' '}
function ejsCodeMask(content){
  const out=Array.from(content,ch=>ch==='\n'?'\n':' ');let cursor=0;
  while(cursor<content.length){
    const open=content.indexOf('<%',cursor);if(open<0)break;
    let pos=open+2,mode='',mark=content[pos]||'';if('=_-#%'.includes(mark)){mode=mark;pos++}
    const close=content.indexOf('%>',pos);if(close<0)break;
    let end=close;if(content[end-1]==='-'||content[end-1]==='_')end--;
    if(mode!=='#'&&mode!=='%')for(let i=pos;i<end;i++)out[i]=content[i];
    cursor=close+2;
  }
  return out.join('');
}
function looksLikeRegexStart(a,index){
  let j=index-1;while(j>=0&&/\s/.test(a[j]))j--;
  if(j<0)return true;
  if('([{:;,=!?&|+-*%^~<>'.includes(a[j]))return true;
  let end=j+1;while(j>=0&&/[A-Za-z_$]/.test(a[j]))j--;
  const word=a.slice(j+1,end).join('');
  return['return','throw','case','delete','void','typeof','instanceof','in','of','yield','await'].includes(word);
}
function maskStringsAndComments(code){
  const a=code.split('');let i=0;
  while(i<a.length){
    const c=a[i],n=a[i+1];
    if(c==='/'&&n==='/'){const s=i;i+=2;while(i<a.length&&a[i]!=='\n')i++;blankRange(a,s,i);continue}
    if(c==='/'&&n==='*'){const s=i;i+=2;while(i<a.length-1&&!(a[i]==='*'&&a[i+1]==='/'))i++;i=Math.min(a.length,i+2);blankRange(a,s,i);continue}
    if(c==='/'&&looksLikeRegexStart(a,i)){
      const s=i;let inClass=false,closed=false;i++;
      while(i<a.length){
        if(a[i]==='\\'){i+=2;continue}
        if(a[i]==='\n')break;
        if(a[i]==='['){inClass=true;i++;continue}
        if(a[i]===']'){inClass=false;i++;continue}
        if(a[i]==='/'&&!inClass){i++;while(i<a.length&&/[A-Za-z]/.test(a[i]))i++;closed=true;break}
        i++;
      }
      if(closed){blankRange(a,s,i);continue}
      i=s+1;continue;
    }
    if(c==="'"||c==='"'||c.charCodeAt(0)===96){const s=i,quote=c;i++;while(i<a.length){if(a[i]==='\\'){i+=2;continue}if(a[i]===quote){i++;break}i++}blankRange(a,s,i);continue}
    i++;
  }
  return a.join('');
}
function inForHeader(clean,index){
  const before=clean.slice(Math.max(0,index-240),index);
  return/\bfor(?:\s+await)?\s*\([^)]*$/.test(before);
}
function functionRanges(clean){
  const ranges=[],re=/\b(?:async\s+)?function\s*\*?\s*(?:[A-Za-z_$][\w$]*)?\s*\([^)]*\)\s*\{/g;let m;
  while((m=re.exec(clean))){
    const open=clean.indexOf('{',m.index),start=open+1;let depth=1,i=start;
    for(;i<clean.length;i++){if(clean[i]==='{')depth++;else if(clean[i]==='}'&&--depth===0)break}
    if(depth===0)ranges.push([start,i]);
  }
  return ranges;
}
function insideRanges(index,ranges){return ranges.some(([start,end])=>index>=start&&index<end)}
function depthMap(clean){
  const depth=new Int32Array(clean.length+1);let d=0;
  for(let i=0;i<clean.length;i++){depth[i]=d;if(clean[i]==='{')d++;else if(clean[i]==='}')d=Math.max(0,d-1)}
  depth[clean.length]=d;return depth;
}
function templateToJs(content,privateScope=false){
  let out=privateScope?'await (async()=>{\n':'',cursor=0;
  while(cursor<content.length){
    const open=content.indexOf('<%',cursor);if(open<0)break;
    let pos=open+2,mode='',mark=content[pos]||'';if('=_-#%'.includes(mark)){mode=mark;pos++}
    const close=content.indexOf('%>',pos);if(close<0)throw new SyntaxError('EJS 标签未闭合：缺少 %>');
    let code=content.slice(pos,close);if(code.endsWith('-')||code.endsWith('_'))code=code.slice(0,-1);
    const skipped=content.slice(cursor,open);out+='\n'.repeat((skipped.match(/\n/g)||[]).length);
    if(mode==='#')out+='\n'.repeat((code.match(/\n/g)||[]).length);
    else if(mode==='%'){}
    else if(mode==='='||mode==='-')out+='\nvoid ('+code+');\n';
    else out+='\n'+code+'\n';
    cursor=close+2;
  }
  if(privateScope)out+='\n})();\n';return out;
}
function compileOnly(code){
  try{const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;new AsyncFunction('__ctx','with (__ctx) {\n'+code+'\n}');return null}
  catch(err){return String(err&&err.message?err.message:err)}
}
function finding(ruleId,severity,title,entry,index,detail,suggestion,extra={}){
  return{ruleId,severity,title,detail,suggestion,book:entry?entry.fileName:(extra.book||''),entry:entry?entry.name:(extra.entry||''),uid:entry?entry.uid:(extra.uid??''),line:entry?lineFromIndex(entry.content,index||0):(extra.line||1),bookOrder:entry?entry.bookOrder:(extra.bookOrder??999999),entryOrder:entry?entry.entryOrder:(extra.entryOrder??999999)};
}
function firstMatch(re,text){re.lastIndex=0;return re.exec(text)}
function hasLeakDocumentation(content,index,name){
  const area=content.slice(Math.max(0,index-700),Math.min(content.length,index+700)).toLowerCase();
  return(/\bintentional\b|\bdeclared\b|故意|刻意|设计行为/.test(area))&&(/\bowner\s*:|归属|负责人|责任/.test(area))&&(/\blifecycle\s*:|生命周期/.test(area))&&(/\bcleanup\s*:|清理|delete\s+(?:globalthis|window)\s*\./.test(area))&&!!name;
}
function collectDirectUrls(content){const out=[],re=/https?:\/\/[^\s"'<>\\)]+/gi;let m;while((m=re.exec(content)))out.push({url:m[0],index:m.index});return out}
function isIpHost(host){
  const h=host.replace(/^\[|\]$/g,'');if(h.includes(':'))return true;
  const p=h.split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&Number(x)>=0&&Number(x)<=255);
}
function isOfficialUrl(url){
  try{const u=new URL(url);return OFFICIAL_URL_RULES.some(r=>u.hostname.toLowerCase()===r.host&&r.path.test(u.pathname))}
  catch{return false}
}
function inspectLinks(entry,findings){
  for(const item of collectDirectUrls(entry.content)){
    let u;try{u=new URL(item.url)}catch{continue}
    if(isIpHost(u.hostname))findings.push(finding('U4','warn','外链使用 IP 直连',entry,item.index,item.url,'改用可识别、可审核的 HTTPS 域名；若确有必要，请明确说明用途。'));
    else if(u.protocol==='http:')findings.push(finding('U3','warn','外链使用不安全 HTTP',entry,item.index,item.url,'改成 HTTPS；若目标不支持 HTTPS，不建议把它作为世界书依赖。'));
    else if(!isOfficialUrl(item.url))findings.push(finding('U2','warn','外链来自非官方域名',entry,item.index,item.url,'确认域名归属与用途；若是项目依赖，建议使用已知可信来源并在条目中说明。'));
  }
  const concatRe=/((?:"(?:\\.|[^"])*"|'(?:\\.|[^'])*')\s*(?:\+\s*(?:"(?:\\.|[^"])*"|'(?:\\.|[^'])*'))+)/g;let m;
  while((m=concatRe.exec(entry.content))){
    const parts=m[0].match(/"(?:\\.|[^"])*"|'(?:\\.|[^'])*'/g)||[];
    const joined=parts.map(p=>{const q=p[0];return p.slice(1,-1).replace(new RegExp('\\\\'+q,'g'),q).replace(/\\\\/g,'\\')}).join('');
    if(/^https?:\/\//i.test(joined))findings.push(finding('U5','warn','URL 由字符串拼接隐藏',entry,m.index,joined,'直接写出完整 URL，让审核者能一眼看到真实目标地址。'));
  }
}
function inspectSyntax(entry,findings){
  if(!entry.hasEjs)return;let code;
  try{code=templateToJs(entry.content,entry.isPrivate)}catch(err){findings.push(finding('EJS-PARSE','high','EJS 无法解析',entry,0,String(err.message||err),'检查 <% ... %> 标签是否完整闭合。'));return}
  const error=compileOnly(code);if(error)findings.push(finding('EJS-PARSE','high','EJS 无法编译',entry,0,error,'检查括号、引号、花括号以及 EJS 标签内的 JavaScript 语法。'));
}
function inspectLexical(entry,findings){
  if(!entry.hasEjs)return;
  const rawMask=ejsCodeMask(entry.content),clean=maskStringsAndComments(rawMask),depth=depthMap(clean),declaredNames=new Set(),fnRanges=functionRanges(clean),topVars=new Map();let m;

  const fnRe=/\b(?:async\s+)?function\s*\*?\s+([A-Za-z_$][\w$]*)\s*\(/g;
  while((m=fnRe.exec(clean))){
    declaredNames.add(m[1]);
    if(depth[m.index]!==0||entry.isPrivate)continue;
    entry.symbols.push({name:m[1],index:m.index,type:'function'});
  }

  const varRe=/\bvar\s+([A-Za-z_$][\w$]*)/g;
  while((m=varRe.exec(clean))){
    const name=m[1];declaredNames.add(name);
    findings.push(finding('L1','info','检测到 var（预防提示）',entry,m.index,'检测到 var '+name+'。var 使用函数作用域；若多个同时激活的世界书条目用了同名 var，可能静默共享或覆盖。','如果这里只需要局部临时变量，优先使用 const/let；不要机械批量替换，先确认作用域与后续赋值。'));
    if(entry.isPrivate||insideRanges(m.index,fnRanges))continue;
    entry.symbols.push({name,index:m.index,type:'var'});
    if(!topVars.has(name))topVars.set(name,[]);
    topVars.get(name).push(m.index);
  }
  for(const [name,positions] of topVars){
    if(positions.length>1)findings.push(finding('L1','warn','同一条目重复声明同名 var',entry,positions[1],'var '+name+' 在同一个 EJS 函数作用域内重复声明 '+positions.length+' 次；这些声明实际操作的是同一个变量。','确认是否有意复用同一个变量；否则只声明一次，后续用普通赋值，或改用更清楚的局部作用域。'));
  }

  const declRe=/\b(let|const)\s+([A-Za-z_$][\w$]*)/g;
  while((m=declRe.exec(clean))){
    const kind=m[1],name=m[2],at=m.index,top=depth[at]===0&&!entry.isPrivate&&!inForHeader(clean,at);
    declaredNames.add(name);
    if(top)entry.symbols.push({name,index:at,type:kind});
  }

  const reportGlobal=(base,name,index)=>{
    const documented=hasLeakDocumentation(entry.content,index,name);
    entry.symbols.push({name,index,type:'global'});
    if(documented)findings.push(finding('L4','info','已声明的共享全局行为',entry,index,base+'.'+name+' 的用途、Owner、Lifecycle 与 Cleanup 已有说明。','保持说明与清理责任同步；若不再需要共享，改回局部状态。'));
    else{
      findings.push(finding('L4','warn','写入共享全局状态',entry,index,base+'.'+name+' 会写入共享全局对象；同一次运行中的其他条目也能读写它。','若确实需要共享状态，请说明用途、生命周期与清理方式；否则改成局部变量。'));
      if(GENERIC_GLOBAL_NAMES.has(name))findings.push(finding('L5','info','共享名称过于通用',entry,index,name+' 是常见通用名；作为共享状态时更容易与其他条目或脚本撞名。','若确实需要共享状态，改用带项目/功能前缀的唯一名称。'));
    }
  };
  const assignOp='(?:=(?!=|>)|\\+=|-=|\\*=|\\/=|%=|\\?\\?=|&&=|\\|\\|=)';
  const dotGlobalRe=new RegExp('\\b(globalThis|window|self)\\s*\\.\\s*([A-Za-z_$][\\w$]*)\\s*'+assignOp,'g');
  while((m=dotGlobalRe.exec(clean)))reportGlobal(m[1],m[2],m.index);
  const bracketGlobalRe=/\b(globalThis|window|self)\s*\[\s*(['"])([A-Za-z_$][\w$]*)\2\s*\]\s*(?:=(?!=|>)|\+=|-=|\*=|\/=|%=|\?\?=|&&=|\|\|=)/g;
  while((m=bracketGlobalRe.exec(rawMask))){
    if(clean.slice(m.index,m.index+m[1].length)===m[1])reportGlobal(m[1],m[3],m.index);
  }

  const reportImplicit=(name,nameIndex)=>{
    if(declaredNames.has(name))return;
    entry.symbols.push({name,index:nameIndex,type:'implicit'});
    findings.push(finding('L4','warn','未声明赋值会改写共享环境或全局状态',entry,nameIndex,name+' 没有 let/const/var 声明。真实 ST 测试表明，这类写入可能覆盖 EJS 提供的环境值，也可能形成共享全局。','如果只是临时变量，请先用 const/let 声明；若确实要共享，请改成明确的共享状态并写清用途与清理方式。'));
    if(GENERIC_GLOBAL_NAMES.has(name))findings.push(finding('L5','info','共享名称过于通用',entry,nameIndex,name+' 是常见通用名；一旦成为共享状态，更容易与其他条目或脚本撞名。','若确实需要共享状态，改用带项目/功能前缀的唯一名称。'));
  };
  const bareAssignRe=/(?:^|[;{}\n)])\s*([A-Za-z_$][\w$]*)\s*(?:=(?!=|>)|\+=|-=|\*=|\/=|%=|\?\?=|&&=|\|\|=)/gm;
  while((m=bareAssignRe.exec(clean))){const name=m[1];reportImplicit(name,m.index+m[0].indexOf(name))}
  const prefixIncRe=/(?:^|[;{}\n)])\s*(?:\+\+|--)\s*([A-Za-z_$][\w$]*)/gm;
  while((m=prefixIncRe.exec(clean))){const name=m[1];reportImplicit(name,m.index+m[0].lastIndexOf(name))}
  const postfixIncRe=/(?:^|[;{}\n)])\s*([A-Za-z_$][\w$]*)\s*(?:\+\+|--)/gm;
  while((m=postfixIncRe.exec(clean))){const name=m[1];reportImplicit(name,m.index+m[0].indexOf(name))}

  let sensitiveHit=firstMatch(/(?:^|[^\w$.])(?:localStorage|sessionStorage|indexedDB)\s*(?:\.|\[)|\b(?:window|globalThis|self)\s*\.\s*(?:localStorage|sessionStorage|indexedDB)\b|\bdocument\s*\.\s*cookie\b/gm,clean);
  if(!sensitiveHit){
    const bracketCookie=/\bdocument\s*\[\s*(['"])cookie\1\s*\]/g;let b;
    while((b=bracketCookie.exec(rawMask))){if(clean.slice(b.index,b.index+8)==='document'){sensitiveHit=b;break}}
  }
  if(sensitiveHit)findings.push(finding('M3','warn','访问敏感浏览器数据',entry,sensitiveHit.index,sensitiveHit[0],'确认是否真的需要访问浏览器存储/凭据；不要读取与功能无关的 token、Cookie 或用户数据。'));

  const rules=[
    ['M1','high','使用 eval 动态执行代码',/\beval\s*\(/g,'避免 eval；把逻辑写成明确函数或数据映射。'],
    ['M2','high','使用 Function 构造器动态创建代码',/\b(?:new\s+)?(?:(?:window|globalThis|self)\s*\.\s*)?Function\s*\(/g,'避免 Function 构造器；改用固定函数或显式分支。'],
    ['M4','warn','检测到网络请求 / 数据外发能力',/\b(?:fetch\s*\(|XMLHttpRequest\b|WebSocket\s*\(|EventSource\s*\(|(?:navigator\.)?sendBeacon\s*\()/g,'确认请求目标、发送内容与必要性；若不需要联网，请删除。'],
    ['M5','high','检测到明显无界循环',/\bwhile\s*\(\s*(?:true|1)\s*\)|\bfor\s*\(\s*;\s*;\s*\)/g,'为循环加入明确结束条件；不要让世界书代码无限占用页面线程。'],
    ['M6','warn','检测到难以审核的字符串混淆',/\b(?:String\.(?:fromCharCode|fromCodePoint)\s*\(|atob\s*\()/g,'直接写出可读字符串；不要用字符码/Base64 隐藏关键文本或地址。']
  ];
  for(const [ruleId,severity,title,re,suggestion] of rules){const hit=firstMatch(re,clean);if(hit)findings.push(finding(ruleId,severity,title,entry,hit.index,hit[0],suggestion))}
}
function detectCrossEntryCollisions(entries,findings){
  const map=new Map();
  for(const entry of entries){
    const seen=new Set();
    for(const symbol of entry.symbols){
      const key=symbol.name+':'+symbol.type;
      if(!symbol.name||seen.has(key))continue;seen.add(key);
      if(!map.has(symbol.name))map.set(symbol.name,[]);map.get(symbol.name).push({entry,symbol});
    }
  }
  const emit=(ruleId,severity,title,name,items,detail,suggestion)=>{
    const a=items[0],f=finding(ruleId,severity,title,a.entry,a.symbol.index,detail,suggestion);
    f.entry=items.map(x=>x.entry.name).join(' ↔ ');f.uid=items.map(x=>String(x.entry.uid)).join(' ↔ ');findings.push(f);
  };
  for(const [name,list] of map){
    const entryCount=items=>new Set(items.map(x=>x.entry.id)).size;
    if(entryCount(list)<2)continue;

    const declarations=list.filter(x=>['let','const','var','function'].includes(x.symbol.type));
    const lexical=declarations.filter(x=>x.symbol.type==='let'||x.symbol.type==='const');
    if(lexical.length&&entryCount(declarations)>=2){
      emit('L2','high','不同条目的顶层声明会直接冲突',name,declarations,name+' 在多个可能同时激活的条目中被顶层声明。真实 ST 测试会出现重复声明/编译失败。涉及：'+declarations.map(x=>x.entry.name+' ('+x.symbol.type+')').join(' ↔ '),'给每个条目的顶层名称加唯一前缀，或把临时 let/const 放进独立 { ... } 块 / @@private。');
      continue;
    }

    const functions=list.filter(x=>x.symbol.type==='function');
    if(entryCount(functions)>=2){
      emit('L3','warn','不同条目的同名顶层函数会互相覆盖',name,functions,'函数 '+name+' 同时出现在：'+functions.map(x=>x.entry.name).join(' ↔ ')+'。真实 ST 测试中这类冲突可能不报错，而是多个条目调用到同一个函数实现。','给函数加项目/条目前缀，或放进独立 { ... } 块 / @@private，避免静默覆盖。');
      continue;
    }

    const localShared=list.filter(x=>x.symbol.type!=='global');
    const explicitGlobals=list.filter(x=>x.symbol.type==='global');
    let participants=[];
    if(entryCount(localShared)>=2)participants=localShared;
    else if(entryCount(explicitGlobals)>=2)participants=explicitGlobals;
    else if(!declarations.length&&entryCount(list)>=2)participants=list;
    if(participants.length){
      emit('L6','warn','不同条目正在共享或覆盖同一个名称',name,participants,name+' 同时出现在：'+participants.map(x=>x.entry.name+' ('+x.symbol.type+')').join(' ↔ ')+'。真实 ST 测试表明，这类名称可在条目之间串值或互相覆盖。','如果它不是刻意共享状态，请改成唯一名称或局部声明；如果是刻意共享，请明确用途、生命周期与清理方式。');
    }
  }
}
function compareFindings(a,b){return a.bookOrder-b.bookOrder||a.entryOrder-b.entryOrder||a.line-b.line||a.ruleId.localeCompare(b.ruleId,'en')}
async function parseFile(file,bookOrder){
  if(file.size>MAX_FILE_BYTES)throw new Error('文件超过 12 MB 上限');
  const json=JSON.parse(await file.text());return{fileName:file.name,size:file.size,bookOrder,entries:extractEntries(json,file.name,bookOrder)};
}
async function analyzeFiles(files){
  const books=[],findings=[];
  for(let i=0;i<files.length;i++){
    try{books.push(await parseFile(files[i],i))}
    catch(err){findings.push({ruleId:'FILE',severity:'high',title:'无法读取世界书',detail:String(err.message||err),suggestion:'确认这是有效的 SillyTavern 世界书 JSON，且文件小于 12 MB。',book:files[i].name,entry:'',uid:'',line:1,bookOrder:i,entryOrder:-1})}
  }
  const entries=books.flatMap(b=>b.entries);
  for(const entry of entries){inspectSyntax(entry,findings);inspectLexical(entry,findings);inspectLinks(entry,findings)}
  detectCrossEntryCollisions(entries,findings);findings.sort(compareFindings);
  state.books=books;state.findings=findings;state.report={generatedAt:new Date().toISOString(),tool:'Poem Workshop EJS Preflight',rules:'L1-L6,M1-M6,U2-U5,EJS-PARSE',books:books.map(b=>({fileName:b.fileName,size:b.size,entries:b.entries.length,ejsEntries:b.entries.filter(e=>e.hasEjs).length})),findings};render();
  return{books,entries,findings};
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  const entries=state.books.flatMap(b=>b.entries),high=state.findings.filter(f=>f.severity==='high').length,warn=state.findings.filter(f=>f.severity==='warn').length;
  q('mBooks').textContent=state.books.length;q('mEntries').textContent=entries.length;q('mHigh').textContent=high;q('mWarn').textContent=warn;q('resultRoot').classList.remove('hidden');q('exportBtn').disabled=!state.report;
  if(!state.findings.length)q('findings').innerHTML='<div class="finding"><div class="finding-head"><span class="badge info">OK</span><div class="finding-title">没有发现当前规则覆盖的静态问题</div></div><p>这不代表运行时绝对安全，但 L/M/U 与 EJS 解析检查均未命中。</p></div>';
  else q('findings').innerHTML=state.findings.map(f=>{const badge=f.severity==='high'?'高风险':f.severity==='warn'?'处理':'信息';return'<article class="finding"><div class="finding-head"><span class="badge '+f.severity+'">'+badge+'</span><div class="finding-title">['+esc(f.ruleId)+'] '+esc(f.title)+'</div></div><p>'+(f.book?'文件：'+esc(f.book)+'\n':'')+(f.entry?'条目：'+esc(f.entry)+(f.uid!==''?' (UID '+esc(f.uid)+')':'')+'\n':'')+'行号：'+esc(f.line)+'\n'+esc(f.detail)+'</p><p class="fix"><strong>建议：</strong>'+esc(f.suggestion)+'</p></article>'}).join('');
  q('books').innerHTML=state.books.map(b=>'<article class="book"><h3>'+esc(b.fileName)+'</h3><div class="book-meta">已扫描条目：'+b.entries.length+'<br>包含 EJS：'+b.entries.filter(e=>e.hasEjs).length+'</div></article>').join('');
}
function clearAll(){state.books=[];state.findings=[];state.report=null;q('fileInput').value='';q('resultRoot').classList.add('hidden');q('exportBtn').disabled=true}
function exportReport(){if(!state.report)return;const blob=new Blob([JSON.stringify(state.report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ejs-preflight-report-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

    ['EJS-L00-合格局部作用域',[]],
